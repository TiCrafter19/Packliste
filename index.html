@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@450;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

.app, .app * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.app button { touch-action: manipulation; }
.app .row-btn, .app .card, .app .bar-title, .app .block-head, .app .seg, .app .switch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

.app {
  --ink: #15171C; --ink2: #656C77; --line: #E7E8EC; --card: #FFFFFF; --tint: #F2F3F5;
  --deep: #15171C; --accent: #FF7A45; --ring: #2E9CB8;
  min-height: 100dvh; background: var(--tint); color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.45;
  transition: background 480ms ease; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; }
.boot { height: 60vh; }

.eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink2); margin: 0 0 10px; }
.foot-note { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink2); text-align: center; margin: 22px 20px 8px; line-height: 1.6; opacity: .8; }

/* Men\xFC */
.menu { padding: 34px 16px 8px; }
.menu-head { padding: 0 6px 22px; }
.menu-head h1 { font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.02; letter-spacing: -.025em; margin: 0; }
.cards { display: flex; flex-direction: column; gap: 14px; }
.card { display: block; width: 100%; text-align: left; padding: 0; border: 0; background: var(--card); border-radius: 18px; overflow: hidden; cursor: pointer;
  box-shadow: 0 1px 2px rgba(20,22,28,.06), 0 8px 24px -14px rgba(20,22,28,.34); transition: transform 180ms cubic-bezier(.2,.8,.2,1), box-shadow 180ms ease; font: inherit; color: inherit; }
.card:active { transform: scale(.985); }
.card:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.card-art { height: 96px; position: relative; }
.card-body { display: flex; align-items: center; gap: 12px; padding: 13px 16px 9px; }
.card-text { flex: 1; min-width: 0; }
.card-body h3 { font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -.012em; margin: 0; }
.card-body p { margin: 1px 0 0; font-size: 13px; color: var(--ink2); }
.card-go { color: var(--ink2); display: flex; flex: none; }
.card-foot { display: flex; align-items: center; gap: 10px; padding: 0 16px 15px; }
